include hyde.conf

# Override HyDE's window_padding_width (empty margin on all sides of the
# terminal content). 0 removes the padding so neovim/btop/opencode fill the window.
window_padding_width 0

font_family JetBrainsMono NF
font_size 10
# Remote control socket: lets `kitty @` work from inside neovim (used by the
# <leader>zi / <leader>zo font zoom) and from the shell.
allow_remote_control yes
listen_on unix:$XDG_RUNTIME_DIR/kitty.sock

cursor_shape block
cursor_stop_blinking_after 0
scrollback_lines 2000
copy_on_select yes
mouse_hide_wait 0
select_by_word_characters @-./_~?&=%+#a
enable_audio_bell no
bell_on_tab "🔔 "
remember_window_size  no
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.6
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_style powerline

# Font-size zoom (kitty handles these before the app sees them, so they work
# inside neovim). Explicit so no theme overrides them.
map ctrl+plus increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0 restore_font_size

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
